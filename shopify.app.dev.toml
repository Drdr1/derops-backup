# Development app (derops-backup-dev). `scripts/dev-web.sh` runs `shopify app dev -c dev`.
# No theme-write exemption on this app: single-file / whole-theme restore returns "Access denied" here.

client_id = "a5a2e943406326a9be422f0a456922fc"
name = "derops-backup-dev"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = """
write_products,\
write_themes,\
write_files,\
write_content,\
write_online_store_navigation,\
write_metaobjects,\
write_metaobject_definitions,\
write_discounts,\
write_inventory,\
read_locations\
"""

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

  # Change feed → debounced incremental backups (paid plans)
  [[webhooks.subscriptions]]
  uri = "/webhooks/changes"
  topics = [
    "products/create", "products/update", "products/delete",
    "collections/create", "collections/update", "collections/delete",
    "themes/create", "themes/update", "themes/delete", "themes/publish",
  ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
